openapi: 3.0.3
info:
  title: Project Management System API
  description: REST API for the PMS SaaS platform
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Teams
  - name: Projects
  - name: Tasks
  - name: Comments
  - name: Files
  - name: Notifications
  - name: Calendar
  - name: Reports
  - name: Search
  - name: Activity
paths:
  /health:
    get:
      summary: Health check
      tags: [Auth]
      responses:
        '200':
          description: Service healthy
  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, full_name, password]
              properties:
                email: { type: string }
                username: { type: string }
                full_name: { type: string }
                password: { type: string }
      responses:
        '201': { description: User created }
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Tokens returned }
  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logged out }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: New access token }
  /auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Auth]
      responses:
        '200': { description: Email sent if account exists }
  /auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Auth]
      responses:
        '200': { description: Password reset }
  /auth/verify-email:
    post:
      summary: Verify email with token
      tags: [Auth]
      responses:
        '200': { description: Email verified }
  /users/me:
    get:
      summary: Current user profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile }
    patch:
      summary: Update profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile updated }
  /users/me/password:
    patch:
      summary: Change password
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Password changed }
  /users:
    get:
      summary: List users
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: User list }
  /users/{user_id}:
    get:
      summary: Get user by ID
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: User details }
  /organizations:
    get:
      summary: List organizations
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization list }
    post:
      summary: Create organization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Organization created }
  /organizations/{org_id}:
    get:
      summary: Get organization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization details }
  /teams:
    get:
      summary: List teams
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Team list }
    post:
      summary: Create team
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Team created }
  /teams/{team_id}:
    get:
      summary: Get team
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Team details }
    patch:
      summary: Update team
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Team updated }
    delete:
      summary: Archive team
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Team archived }
  /teams/{team_id}/members:
    post:
      summary: Add team member
      tags: [Teams]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Member added }
  /projects:
    get:
      summary: List projects
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project list }
    post:
      summary: Create project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Project created }
  /projects/{project_id}:
    get:
      summary: Get project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project details }
    patch:
      summary: Update project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project updated }
    delete:
      summary: Delete project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project deleted }
  /tasks:
    get:
      summary: List tasks
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task list }
    post:
      summary: Create task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Task created }
  /tasks/{task_id}:
    get:
      summary: Get task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task details }
    patch:
      summary: Update task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task updated }
    delete:
      summary: Delete task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task deleted }
  /tasks/{task_id}/assign:
    post:
      summary: Assign task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task assigned }
  /tasks/{task_id}/subtasks:
    post:
      summary: Create subtask
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Subtask created }
  /tasks/kanban/{project_id}:
    get:
      summary: Kanban board
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Kanban columns }
  /tasks/{task_id}/move:
    post:
      summary: Move task on kanban
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task moved }
  /tasks/kanban/{project_id}/reorder:
    post:
      summary: Bulk reorder kanban
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Board reordered }
  /tasks/{task_id}/comments:
    get:
      summary: List comments
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comment list }
    post:
      summary: Create comment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Comment created }
  /comments/{comment_id}:
    patch:
      summary: Update comment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comment updated }
    delete:
      summary: Delete comment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Comment deleted }
  /files/upload:
    post:
      summary: Upload file
      tags: [Files]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: File uploaded }
  /files:
    get:
      summary: List files
      tags: [Files]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: File list }
  /files/{file_id}/download:
    get:
      summary: Download file
      tags: [Files]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: File download }
  /files/{file_id}:
    delete:
      summary: Delete file
      tags: [Files]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: File deleted }
  /notifications:
    get:
      summary: List notifications
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Notification list }
  /notifications/unread-count:
    get:
      summary: Unread count
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unread count }
  /notifications/{id}/read:
    post:
      summary: Mark notification read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Marked read }
  /notifications/read-all:
    post:
      summary: Mark all read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All marked read }
  /calendar/events:
    get:
      summary: Calendar events
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Event list }
  /reports/analytics:
    get:
      summary: Analytics dashboard
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Analytics data }
  /search:
    get:
      summary: Global search
      tags: [Search]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { description: Search results }
  /activity:
    get:
      summary: Activity log
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Activity list }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
